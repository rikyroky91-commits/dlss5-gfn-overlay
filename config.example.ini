# dlss5-gfn-overlay configuration.
# Copy to config.ini next to the executable and edit. Every key is optional;
# what is not listed keeps the built-in default.

[mode]
# reshade: ReShade viene iniettato accanto a questo eseguibile e applica gli
#          add-on DLSS 5 alla nostra swapchain. Non esce niente dalla GPU:
#          l'app cattura e presenta, il resto lo fa l'add-on. È la modalità che
#          corrisponde ai pacchetti ReShade + renodx-dlss5 + dlss5-feed.
# worker:  un processo feeder separato riceve ogni frame su una pipe e
#          restituisce quello migliorato. Costa un giro GPU->CPU->GPU per
#          frame, e serve un worker che parli il protocollo --video.
enhance_mode = reshade

[source]
# Case-insensitive substring of the window title to capture. Run the exe with
# --list-windows to see what is available.
window_title = GeForce NOW

# Pixels to trim from the captured window before the neural pass. Use this to
# cut the client's own chrome and any black bars, so the runtime is not asked
# to enhance a border. Start at 0 and adjust once you can see the output.
crop_left = 0
crop_top = 0
crop_right = 0
crop_bottom = 0

capture_cursor = false

# Le voci qui sotto valgono solo con enhance_mode = worker. In modalita'
# reshade gli add-on leggono le proprie impostazioni dagli ini di ReShade.
[neural]
# Frazione della sorgente su cui gira davvero il pass neurale. Il costo scala
# con i pixel, quindi è la leva principale quando la GPU non tiene il budget
# per frame. 0.667 insieme a upscale_factor 1.5 manda 720p al runtime e
# riottiene 1080p: meno della meta' dei pixel da elaborare e da far passare
# nelle pipe. Su RTX 30 è il primo parametro da abbassare.
neural_input_scale = 1.0

# 1.0 keeps the source resolution (DLAA) and is the right choice for a stream
# that already arrives at display resolution. 1.5, 1.724, 2.0 and 3.0 also
# upscale, which costs proportionally more time per frame.
upscale_factor = 1.0

# 0 = default, 1..3 = experimental native model hints.
nr_preset = 0
# 0 = default, 1 = natural, 2 = cinematic.
nr_style = 0
automatic_mask = false

nr_intensity = 1.0
local_tone_strength = 1.0
local_structure_strength = 1.0
# -1.0 keeps the runtime's own default for skin.
skin_structure_strength = -1.0

# 0 = default, 10 = J, 11 = K, 12 = L, 13 = M.
dlss_model_preset = 0

warmup_frames = 0
# 0 means an unbounded stream. If your worker build rejects the setup with a
# zero frame count, set a large number here instead.
frame_count_hint = 0

[output]
fullscreen = true
# -1 follows the monitor the captured window is on. 0, 1, 2... pick explicitly.
output_monitor = -1
allow_tearing = true
start_enhanced = true

[hotkeys]
# Modifiers: ctrl, alt, shift, win. Keys: F1-F24, a letter, a digit, space,
# insert, home, end, pause.
hotkey_toggle = alt+F1
hotkey_quit = alt+F4
hotkey_stats = alt+F2

[runtime]
# Path to the DLSS Neural Rendering worker. See runtime/BINARIES.md.
worker_path = runtime/host/nvngx.dll
worker_working_dir = runtime/host
worker_timeout_ms = 10000

log_level = info
